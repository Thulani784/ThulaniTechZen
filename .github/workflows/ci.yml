### 5. CI pipeline (GitHub Actions) — meets B2

#### `.github/workflows/ci.yml`

```yaml
name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  ci-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      # CI checks: lint + unit tests
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --json --outputFile=unit-results.json

      # Security gates: dependency scan
      - name: Dependency scan (npm audit)
        run: npm audit --json > dependency-scan.json || true

      # Security gates: secret scanning (trufflehog via pip)
      - name: Secret scan (trufflehog)
        run: |
          pip install truffleHog==3.0.0
          trufflehog filesystem --json . > secret-scan.json || true

      # Build/package: versioned artefact
      - name: Build package artefact
        run: npm run build:package

      # Upload artefacts for traceability
      - name: Upload CI artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            unit-results.json
            dependency-scan.json
            secret-scan.json
            dist/
